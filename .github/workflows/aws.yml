```yaml
name: CI/CD Django Deployment

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t djanog_webapp-main:latest .

      # 5. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            djanog_webapp-main:latest \
            794038243291.dkr.ecr.us-east-1.amazonaws.com/djanog_webapp-main:latest

      # 6. Push Docker image to ECR
      - name: Push image to ECR
        run: |
          docker push \
            794038243291.dkr.ecr.us-east-1.amazonaws.com/djanog_webapp-main:latest

      # 7. Create SSH key from GitHub Secret
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/kopix.pem
          chmod 600 ~/.ssh/kopix.pem

      # 8. Test SSH connection
      - name: Test SSH Connection
        run: |
          ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i ~/.ssh/kopix.pem \
            ec2-user@${{ secrets.EC2_HOST }} \
            "echo 'SSH connection successful'; whoami; hostname"

      # 9. Deploy to Red Hat EC2
      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i ~/.ssh/kopix.pem \
            ec2-user@${{ secrets.EC2_HOST }} << EOF

            echo "Connected to EC2"

            echo "Logging in to ECR..."

            aws ecr get-login-password --region us-east-1 | \
              sudo docker login \
              --username AWS \
              --password-stdin \
              ${{ secrets.ECR_REGISTRY }}

            echo "Pulling latest image..."

            sudo docker pull \
              ${{ secrets.ECR_REGISTRY }}/djanog_webapp-main:latest

            echo "Stopping old container..."

            sudo docker stop web2 || true

            echo "Removing old container..."

            sudo docker rm web2 || true

            echo "Starting new container..."

            sudo docker run -d \
              --name web2 \
              -p 80:8000 \
              ${{ secrets.ECR_REGISTRY }}/djanog_webapp-main:latest

            echo "Checking container..."

            sudo docker ps

            echo "Deployment completed!"

          EOF

      # 10. Remove SSH key
      - name: Remove SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/kopix.pem
```
