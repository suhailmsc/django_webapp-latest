name: CI/CD Django Deployment

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Configure AWS credentials
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      # 3. Login to Amazon ECR
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Build Docker image
      - name: Build Docker image
        run: |
          docker build -t djanog_webapp-main:latest .

      # 5. Tag Docker image
      - name: Tag Docker image
        run: |
          docker tag \
            djanog_webapp-main:latest \
            794038243291.dkr.ecr.us-east-1.amazonaws.com/djanog_webapp-main:latest

      # 6. Push image to ECR
      - name: Push image to ECR
        run: |
          docker push \
            794038243291.dkr.ecr.us-east-1.amazonaws.com/djanog_webapp-main:latest

      # 7. Setup SSH key
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/kopix.pem
          chmod 600 ~/.ssh/kopix.pem

      # 8. SSH into EC2 and get root access
      - name: SSH into EC2 as root
        run: |
          ssh -o StrictHostKeyChecking=no \
            -o ConnectTimeout=30 \
            -i ~/.ssh/kopix.pem \
            ec2-user@${{ secrets.EC2_HOST }} << 'EOF'

          echo "Connected to EC2"

          # Switch to root
          sudo -i << 'ROOT_EOF'

          echo "================================="
          echo "Root access:"
          whoami

          echo "Hostname:"
          hostname

          echo "Red Hat version:"
          cat /etc/redhat-release
          echo "================================="

          # Login to ECR
          echo "Logging in to ECR..."

          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 794038243291.dkr.ecr.us-east-1.amazonaws.com

          # Pull latest Docker image
          echo "Pulling latest image..."
          docker pull 794038243291.dkr.ecr.us-east-1.amazonaws.com/djanog_webapp-main:latest
          # Stop old container
          echo "Stopping old container..."

          docker stop web2 || true

          # Remove old container
          echo "Removing old container..."

          docker rm web2 || true

          # Run new container
          echo "Starting new container..."

          docker run -d \
            --name web2 \
            -p 80:8000 \
            ${{ secrets.ECR_REGISTRY }}/djanog_webapp-main:latest

          # Check container
          echo "Docker containers:"

          docker ps

          echo "Deployment completed successfully!"

          ROOT_EOF

          EOF

      # 9. Remove SSH private key
      - name: Remove SSH Key
        if: always()
        run: |
          rm -f ~/.ssh/kopix.pem
